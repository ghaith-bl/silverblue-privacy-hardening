# /etc/systemd/system/suricata.service.d/harden-ids.conf - harden-workstation.sh section ids
#
# Fedora's suricata.service, run with this repo's config (docs/ids.md): IDS only (af-packet),
# the interfaces of net.yaml, written right before the start by harden-ids sync (nothing to
# watch: the unit is skipped, not failed). Suricata starts as root, opens its capture
# sockets, then drops to user suricata (--user / --group: libcap-ng keeps the capture
# capabilities only). Reload (new rules): SIGUSR2. Log files reopen: SIGHUP (logrotate).
[Unit]
After=network-online.target hostfw.service
ConditionPathExists=/etc/suricata/harden-ids/suricata.yaml

[Service]
Type=simple
PIDFile=
EnvironmentFile=
ExecStartPre=
ExecCondition=+/usr/local/sbin/harden-ids sync --no-restart
ExecStart=
ExecStart=/usr/bin/suricata -c /etc/suricata/harden-ids/suricata.yaml --af-packet --user suricata --group suricata
ExecReload=
ExecReload=/bin/kill -USR2 $MAINPID
Restart=on-failure
RestartSec=30s
# eve.json and the rest: 0640, group suricata
UMask=0027
# sandbox (systemd-analyze security suricata.service)
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/log/suricata /var/lib/suricata -/run/suricata
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_PACKET AF_NETLINK AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_IPC_LOCK CAP_SYS_NICE CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH
