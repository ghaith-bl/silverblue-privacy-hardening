# /etc/suricata/harden-ids/disable.conf - harden-workstation.sh section ids (docs/ids.md)
#
# ET Open categories kept (relevant here, light on RAM): SCAN MALWARE MOBILE_MALWARE EXPLOIT
# EXPLOIT_KIT DNS COINMINER WORM ATTACK_RESPONSE CNC (botcc, C2 lists). Every other rule is
# disabled by the line below: its message does not start with one of these categories.
# Nothing is enabled anywhere (enable.conf: none), so a rule ET ships disabled stays disabled.
# Suricata's own event rules ("SURICATA ...") are off too: eve's anomaly records cover them.
# Change: edit the list in the repo (ids/disable.conf), section ids again, then
#   sudo systemctl start harden-ids-update.service
re:msg\s*:\s*"(?!ET (SCAN|MALWARE|MOBILE_MALWARE|EXPLOIT|EXPLOIT_KIT|DNS|COINMINER|WORM|ATTACK_RESPONSE|CNC) )
