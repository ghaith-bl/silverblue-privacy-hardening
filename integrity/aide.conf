# /etc/aide.conf - integrity section of silverblue-privacy-hardening (review 2026-11-17,
# D-U1; scope decided 2026-11-22). Written by harden-workstation.sh integrity; an edit
# here = new scope: sudo harden-check --accept shows what it adds, then takes it.
#
# Scope: what can change on Silverblue outside a new deployment. /usr is the image
# (composefs, read-only, checked at deploy / ostree fsck): out, except the audit tools
# (scap-security-guide aide_check_audit_tools). /var/lib/aide (the database): out.
#
# /etc: content, mode, owner, SELinux label, ACL, xattrs; no times, inode, link or block
# count: every new deployment copies /etc again (host 2026-11-20: 4841 entries got a new
# ctime, 2 had new content).

@@define DBDIR /var/lib/aide
@@define LOGDIR /var/log/aide

database_in=file:@@{DBDIR}/aide.db.gz
database_out=file:@@{DBDIR}/aide.db.new.gz
gzip_dbout=yes

# journal of aidecheck.service: the changed entries; harden-check reads the json report
report_level=list_entries
report_format=plain
report_url=stdout
report_level=changed_attributes
report_format=json
report_url=file:@@{LOGDIR}/aide.json

CONTENT = ftype+p+u+g+s+l+sha512+acl+selinux+xattrs
DIRS = ftype+p+u+g+acl+selinux+xattrs
# names, mode, owner, label only: files their own daemon rewrites
NAMES = ftype+p+u+g+selinux

# audit tools: the attributes scap-security-guide checks for (exact text)
/usr/sbin/auditctl p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
/usr/sbin/auditd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
/usr/sbin/ausearch p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
/usr/sbin/aureport p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
/usr/sbin/audispd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
/usr/sbin/augenrules p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

# --- /etc -------------------------------------------------------------------------------
# rewritten by their daemon (content changes on its own): names, mode, owner, label
/etc/NetworkManager/system-connections/ f NAMES
/etc/mullvad-vpn/[^/]+\.json$ f NAMES
/etc/asusd/[^/]+\.ron$ f NAMES
/etc/supergfxd\.conf$ f NAMES
/etc/tuned/(active_profile|post_loaded_profile|profile_mode|ppd_base_profile|bootcmdline)$ f NAMES
/etc/adjtime$ f NAMES
/etc/cups/subscriptions\.conf(\.O)?$ f NAMES
# Suricata's network part, rewritten on every network change (harden-ids sync, section ids)
/etc/suricata/harden-ids/net\.yaml$ f NAMES
# resource limits systemd writes at every login, one set per user (uid in the name)
/etc/systemd/system\.control/user[-\@.][^/]*\.d/50-(CPUWeight|IOWeight|MemoryLow|MemoryMin)\.conf$ f NAMES
/etc d DIRS
/etc 0 CONTENT

# --- /boot, /boot/efi: kernels, initramfs (not covered by Secure Boot), GRUB, shim ----
/boot d DIRS
/boot 0 CONTENT

# --- /var: root scripts and code, root's home, crontabs ---------------------------------
/var/usrlocal d DIRS
/var/usrlocal 0 CONTENT
!/var/roothome/\.cache
/var/roothome/\.(bash_history|lesshst|python_history|viminfo|wget-hsts)$ f NAMES
/var/roothome d DIRS
/var/roothome 0 CONTENT
/var/spool/cron d DIRS
/var/spool/cron 0 CONTENT
